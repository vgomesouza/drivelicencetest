<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado Class E — Flórida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#1A1D21; --muted:#6E7681; --line:#E3E1DC; --paper:#F4F2EE;
  --green:#14653F; --green-soft:#E8F2EC; --red:#B3261E; --red-soft:#FBEBEA;
  --amber:#F0B429; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fff; color:var(--ink);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:20px 18px 72px}
.cond{font-family:'Barlow Condensed',sans-serif}

/* barra de progresso: faixa de rolamento */
.lane{height:12px;background:var(--paper);border-radius:6px;display:flex;align-items:center;overflow:hidden}
.lane-fill{height:3px;background:repeating-linear-gradient(90deg,var(--amber) 0 12px,transparent 12px 22px);transition:width .3s ease}
.meta{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:15px;color:var(--muted);margin:8px 0 22px}
.meta b{color:var(--ink)}

/* palco da placa / diagrama */
.stage{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;margin-bottom:20px;display:flex;justify-content:center;align-items:center}
.stage img{width:150px;height:auto;display:block;image-rendering:auto}
.stage svg{width:180px;height:180px;display:block}
@media (max-width:420px){.stage img{width:124px}.stage svg{width:150px;height:150px}}

.q{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:29px;
  line-height:1.18;margin:0 0 18px}

/* alternativas */
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);
  border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;
  font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:#B9B5AC}
.opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}

.exp{border-left:4px solid var(--amber);background:var(--paper);border-radius:0 var(--r) var(--r) 0;
  padding:15px 17px;margin-top:18px}
.verdict{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;margin-bottom:3px}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
.exp p{margin:0;color:#3C4149}
.ref{margin-top:8px;font-size:14px;color:var(--muted)}

.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
  background:var(--green);color:#fff;border:none;border-radius:var(--r);
  padding:13px 28px;cursor:pointer;margin-top:18px}
.btn:hover{background:#0F5233}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--paper);color:var(--ink)}

h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:42px;line-height:1.02;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 32px}
.field{margin-bottom:26px}
.label{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;background:#fff;color:#3C4149;border:1.5px solid var(--line);
  border-radius:20px;padding:7px 15px;cursor:pointer}
.chip:hover{border-color:#B9B5AC}
.chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}

.score{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:82px;line-height:1;margin:0}
.score.pass{color:var(--green)} .score.fail{color:var(--red)}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:23px;margin:2px 0 22px;color:#3C4149}
.review{border-top:1px solid var(--line);padding-top:18px;margin-top:30px}
.review h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:21px;margin:0 0 16px}
.miss{border-left:3px solid var(--red);padding-left:14px;margin-bottom:20px}
.miss .mq{font-weight:600;margin:0 0 3px}
.miss .ma{color:var(--green);margin:0 0 3px;font-size:16px;font-weight:500}
.miss .me{color:var(--muted);margin:0;font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.foot{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- desenhos vetoriais: cruzamentos e placas sem imagem ---------- */
const F = "font-family:'Barlow Condensed',sans-serif;font-weight:700";
const RD="#5B6470", BG="#EFECE6", LN="#E0A92B", EUC="#F0B429", AC="#FFFFFF";

function car(x,y,d,f,t){
  return `<g transform="translate(${x} ${y}) rotate(${d})">
    <rect x="-6.5" y="-10.5" width="13" height="21" rx="3" fill="${f}" stroke="#2B3038" stroke-width="1"/>
    <rect x="-4.5" y="-7.5" width="9" height="6" rx="1" fill="#2B3038" opacity=".3"/></g>
    <text x="${x}" y="${y+7}" text-anchor="middle" fill="#1A1D21" font-size="8" style="${F}">${t}</text>`;
}
const oct = (x,y) => `<g transform="translate(${x} ${y})"><polygon points="-2,-5 2,-5 5,-2 5,2 2,5 -2,5 -5,2 -5,-2" fill="#B3261E" stroke="#fff" stroke-width="1"/></g>`;
const ped = (x,y) => `<g stroke="#2B3038" stroke-width="2.2" fill="none" stroke-linecap="round">
  <circle cx="${x}" cy="${y-7}" r="2.6" fill="#2B3038" stroke="none"/>
  <path d="M${x} ${y-4} L${x} ${y+3} M${x-3.5} ${y-1} L${x+3.5} ${y-1} M${x} ${y+3} L${x-3} ${y+8} M${x} ${y+3} L${x+3} ${y+8}"/></g>`;
const XBASE = `<rect width="100" height="100" fill="${BG}"/>
  <rect x="0" y="34" width="100" height="32" fill="${RD}"/><rect x="34" y="0" width="32" height="100" fill="${RD}"/>
  <path d="M50 0 V32 M50 68 V100 M0 50 H32 M68 50 H100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>`;
const DEFS = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2B3038"/></marker></defs>`;
const arw = d => `<path d="${d}" stroke="#2B3038" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/>`;
const svg = i => `<svg viewBox="0 0 100 100" role="img" aria-label="Diagrama">${DEFS}${i}</svg>`;

const SVGS = {
xopen: svg(XBASE + car(58,80,0,EUC,"EU") + car(84,42,-90,AC,"A")),
xstop: svg(XBASE + oct(28,72)+oct(72,28)+oct(72,72)+oct(28,28) + car(58,82,0,EUC,"EU") + car(84,42,-90,AC,"A")),
xleft: svg(XBASE + car(58,82,0,EUC,"EU") + car(42,18,180,AC,"A") + arw("M58 68 Q58 52 40 50 L24 50")),
xtee: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="0" y="34" width="100" height="32" fill="${RD}"/>
  <rect x="34" y="66" width="32" height="34" fill="${RD}"/>
  <path d="M0 50 H100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M50 68 V100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>`
  + car(58,86,0,EUC,"EU") + car(84,42,-90,AC,"A")),
dirt: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="0" y="34" width="100" height="32" fill="${RD}"/>
  <rect x="34" y="66" width="32" height="34" fill="#A2926F"/>
  <g fill="#8A7B5C"><circle cx="42" cy="76" r="1.4"/><circle cx="58" cy="84" r="1.6"/><circle cx="46" cy="92" r="1.3"/><circle cx="62" cy="72" r="1.2"/></g>
  <path d="M0 50 H100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>`
  + car(58,86,0,EUC,"EU") + car(84,42,-90,AC,"A")),
circle: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="34" y="60" width="32" height="40" fill="${RD}"/>
  <rect x="60" y="34" width="40" height="32" fill="${RD}"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="${RD}" stroke-width="19"/>
  <circle cx="50" cy="50" r="17" fill="#BFCBB4"/>` + car(50,88,0,EUC,"EU") + car(28,44,0,AC,"A")),
crossw: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="0" y="30" width="100" height="40" fill="${RD}"/>
  <path d="M0 50 H100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>
  <g fill="#F2F0EB">${[0,1,2,3,4].map(i=>`<rect x="${52+i*6}" y="32" width="3.6" height="36"/>`).join("")}</g>`
  + car(18,60,90,EUC,"EU") + ped(66,46)),
ramp: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="56" y="0" width="40" height="100" fill="${RD}"/>
  <path d="M76 0 V100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M14 104 Q20 68 44 58 L60 52" stroke="${RD}" stroke-width="20" fill="none" stroke-linecap="round"/>`
  + car(64,34,0,AC,"A") + car(26,78,-18,EUC,"EU")),
driveway: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="0" y="18" width="100" height="32" fill="${RD}"/>
  <rect x="40" y="50" width="22" height="34" fill="#77808C"/><rect x="30" y="84" width="42" height="16" rx="2" fill="#C4C0B6"/>
  <path d="M0 34 H100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>`
  + car(51,68,0,EUC,"EU") + car(86,26,-90,AC,"A") + arw("M51 54 V38")),
backout: svg(`<rect width="100" height="100" fill="${BG}"/><rect x="0" y="18" width="100" height="32" fill="${RD}"/>
  <rect x="40" y="50" width="22" height="34" fill="#77808C"/><rect x="30" y="84" width="42" height="16" rx="2" fill="#C4C0B6"/>
  <path d="M0 34 H100" stroke="${LN}" stroke-width="1.4" stroke-dasharray="5 4"/>`
  + car(51,68,180,EUC,"EU") + car(86,26,-90,AC,"A") + arw("M51 54 V38")),
school: svg(`<polygon points="50,3 97,31 97,97 3,97 3,31" fill="#C6E600" stroke="#1A1D21" stroke-width="3"/>
  <circle cx="38" cy="48" r="6" fill="#1A1D21"/><path d="M38 55 L33 72 L33 88 M38 55 L44 72 L44 88 M28 62 L48 62" stroke="#1A1D21" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="65" cy="45" r="5" fill="#1A1D21"/><path d="M65 51 L61 68 L58 86 M65 51 L70 68 L72 86 M56 58 L74 58" stroke="#1A1D21" stroke-width="4.5" fill="none" stroke-linecap="round"/>`),
crossbuck: svg(`<g transform="rotate(45 50 50)"><rect x="10" y="42" width="80" height="16" fill="#fff" stroke="#1A1D21" stroke-width="2.5"/>
  <text x="50" y="54" text-anchor="middle" fill="#1A1D21" font-size="11" style="${F}">RAILROAD</text></g>
  <g transform="rotate(-45 50 50)"><rect x="10" y="42" width="80" height="16" fill="#fff" stroke="#1A1D21" stroke-width="2.5"/>
  <text x="50" y="54" text-anchor="middle" fill="#1A1D21" font-size="11" style="${F}">CROSSING</text></g>`)
};

{c:"Preferência",pic:"backout",q:"You are backing out of this driveway. Who has the right-of-way?",o:["You do, since you signaled","Traffic and pedestrians already on the road","Whoever arrives first","Neither party"],a:1,e:"Dando ré para a via você cede a todos. Antes de dar ré, verifique atrás do veículo a pé — crianças somem no ponto cego traseiro.",ref:62},
{c:"Preferência",pic:"xtee",q:"Both cars reach this T-intersection together. Who must yield?",o:["The car on the through road","The car on the road that ends","Neither","The car on the left"],a:1,e:"Quem está na via que termina cede a quem segue pela via contínua.",ref:62},
{c:"Preferência",q:"A funeral procession is passing through an intersection. You should:",o:["Cut in if there is a gap","Yield and not interrupt the procession","Proceed if your light is green","Follow closely behind the last car"],a:1,e:"Não corte o cortejo, mesmo com sinal verde para você.",ref:84},
{c:"Preferência",q:"A traffic signal is completely out of order and no officer is directing traffic. You should:",o:["Treat the intersection as a four-way stop","Proceed without stopping","Treat it as a yield","Wait until the signal is repaired"],a:0,e:"Semáforo apagado vira four-way stop: passa na ordem de chegada e, em caso de empate, quem está à esquerda cede a quem está à direita.",ref:79},

/* ===== PLACAS E SINALIZAÇÃO ===== */
{c:"Placas",pic:"stop",q:"This sign always means:",o:["Yield","Come to a complete stop","Slow down and proceed","No passing"],a:1,e:"O octógono é usado apenas para o STOP. Dá para reconhecer só pelo formato, mesmo sem ler.",ref:47},
{c:"Placas",pic:"yield",q:"This sign means:",o:["Stop completely","Slow down and give the right-of-way","No entry","Merge left"],a:1,e:"Triângulo invertido é YIELD. Reduza e pare somente se houver alguém vindo.",ref:47},
{c:"Placas",pic:"rightcurve",q:"A sign of this shape and color is used to:",o:["Give directions","Warn of a condition ahead","Show a speed limit","Mark a school zone"],a:1,e:"Losango amarelo é advertência geral: curva, cruzamento, acostamento fofo, animais.",ref:46},
{c:"Placas",pic:"school",q:"This sign indicates:",o:["A railroad crossing","A school zone or school crossing","A hospital","A no-passing zone"],a:1,e:"O pentágono marca zona ou travessia escolar. Em zona escolar sinalizada, o limite é 20 mph.",ref:46},
{c:"Placas",pic:"construction",q:"Signs of this color on a road indicate:",o:["A scenic detour","A construction or maintenance zone","A toll road","A hospital zone"],a:1,e:"Laranja é obra e manutenção. Desobedecer a sinalização de obra é ilegal e perigoso para quem trabalha ali.",ref:54},
{c:"Placas",pic:"softshoulder",q:"This sign warns you to:",o:["Use the shoulder as a passing lane","Not leave the pavement","Increase your following distance","Expect a sharp curve"],a:1,e:"O acostamento é de terra ou areia solta e não sustenta o carro. Não saia da pista, exceto em emergência.",ref:58},
{c:"Placas",pic:"services",q:"A road sign of this color generally indicates:",o:["Driver services such as lodging and food","A warning","A construction zone","A recreational area"],a:0,e:"Azul é orientação ao motorista e identificação de vagas. Verde é direção, marrom é área recreativa.",ref:46},
{c:"Placas",pic:"nopassing",q:"This sign, posted on the left side of the road, marks:",o:["A school crossing","The beginning of a no-passing zone","A railroad crossing","A merge point"],a:1,e:"A flâmula fica à esquerda e indica trecho em que você não pode ultrapassar.",ref:48},
{c:"Placas",pic:"crossbuck",q:"This sign is posted at:",o:["A school crossing","A railroad crossing","A pedestrian crossing","A highway exit"],a:1,e:"O crossbuck marca a passagem de nível. Nunca pare sobre os trilhos nem a menos de 15 pés do cruzamento.",ref:56},
{c:"Placas",pic:"rxr",q:"This sign tells you that:",o:["A railroad crossing is ahead","You are entering a roundabout","A rest area is ahead","Traffic merges ahead"],a:0,e:"Círculo amarelo com R X R é o aviso antecipado de cruzamento ferroviário. Reduza e prepare-se para parar.",ref:56},
{c:"Placas",pic:"donotenter",q:"This sign means:",o:["The road is closed for repairs","Do not enter — traffic comes from the other direction","Stop and then proceed","No parking beyond this point"],a:1,e:"Você está prestes a entrar na contramão, geralmente numa saída de rodovia ou rua de mão única.",ref:47},
{c:"Placas",pic:"wrongway",q:"You see this sign facing you. It means:",o:["You are driving in the wrong direction; turn around","A detour is ahead","The lane ends","You may not pass"],a:0,e:"Aparece logo depois do DO NOT ENTER. Pare com segurança e retorne imediatamente.",ref:47},
{c:"Placas",pic:"oneway",q:"This sign means that traffic:",o:["May travel in both directions","Flows only in the direction of the arrow","Must turn right","Must merge"],a:1,e:"Rua de mão única. O tráfego corre apenas no sentido da seta.",ref:48},
{c:"Placas",pic:"speedlimit",q:"This sign indicates:",o:["A suggested speed for curves","The maximum legal speed under favorable conditions","The minimum speed allowed","The average speed of traffic"],a:1,e:"Limite máximo em condições favoráveis. Com chuva ou neblina você deve andar abaixo dele mesmo sem outra placa.",ref:68},
{c:"Placas",pic:"advisory",q:"The 25 MPH panel under this curve sign shows:",o:["The legal maximum for the whole road","The fastest safe speed for the curve ahead","The minimum speed in the curve","A speed limit that applies only at night"],a:1,e:"Advisory speed é a maior velocidade segura para aquela curva. Pode acompanhar qualquer placa de advertência.",ref:49},
{c:"Placas",pic:"signalahead",q:"This sign warns you that:",o:["A traffic signal is ahead","A police checkpoint is ahead","The road is closed","A school is ahead"],a:0,e:"Semáforo à frente, muitas vezes escondido por curva ou lombada. Reduza e prepare-se para parar.",ref:49},
{c:"Placas",pic:"merging",q:"This sign means:",o:["The road ends ahead","Another lane joins yours; watch for traffic and yield when necessary","Passing is prohibited","A divided highway begins"],a:1,e:"Merging traffic. Ajuste velocidade e posição para abrir espaço a quem entra.",ref:49},
{c:"Placas",pic:"lanereduce",q:"This sign means:",o:["The right lane ends and traffic must merge left","A bridge is ahead","Two lanes are being added","Trucks must use the left lane"],a:0,e:"Reduction of lanes. Quem está na faixa da esquerda deve facilitar a entrada de quem precisa mudar.",ref:49},
{c:"Placas",pic:"twoway",q:"This sign warns that:",o:["The road becomes one-way","The roadway changes to two-way traffic; there will be oncoming vehicles","Passing is allowed ahead","A divided highway begins"],a:1,e:"A pista deixa de ser separada e passa a ter tráfego nos dois sentidos.",ref:49},
{c:"Placas",pic:"dividedhwy",q:"This sign means:",o:["The highway ahead is divided by a median or barrier","The highway ends","A roundabout is ahead","Lanes merge ahead"],a:0,e:"Divided Highway Ahead. Mantenha-se à direita do canteiro.",ref:49},
{c:"Placas",pic:"dividedends",q:"This sign means:",o:["A divided highway begins","The divided highway ends and two-way traffic resumes","A rest area is ahead","Traffic merges from the right"],a:1,e:"Divided Highway Ends. A pista dupla acaba em 350 a 500 pés e você voltará a ter tráfego em sentido contrário.",ref:49},
{c:"Placas",pic:"roundabout",q:"This sign provides advance notice of:",o:["A traffic circle (roundabout)","A winding road","A U-turn area","A detour"],a:0,e:"Rotatória à frente. Reduza e prepare-se para ceder a quem já está no anel.",ref:49},
{c:"Placas",pic:"crossroad",q:"This sign warns that:",o:["The road ends","A road crosses the main highway ahead","A bridge is ahead","Two lanes merge"],a:1,e:"Cross Road. Olhe para a esquerda e para a direita ao se aproximar.",ref:49},
{c:"Placas",pic:"pedestrian",q:"This sign means:",o:["A school is ahead","Watch for people crossing the road","A bus stop is ahead","Parking area ahead"],a:1,e:"Travessia de pedestres. Reduza e esteja pronto para parar.",ref:50},
{c:"Placas",pic:"bicycle",q:"This sign means:",o:["Bicycles are prohibited","Watch for bicyclists crossing or riding along the road","A bike repair shop is ahead","A bike lane starts here"],a:1,e:"Ao passar por um ciclista, você deve dar pelo menos 3 pés de folga e reduzir a velocidade.",ref:50},
{c:"Placas",pic:"deer",q:"This sign warns that:",o:["Hunting is allowed nearby","Deer frequently cross this stretch of road","A zoo is ahead","Livestock are fenced in"],a:1,e:"Animais atravessam com frequência ali, sobretudo ao amanhecer e ao anoitecer.",ref:50},
{c:"Placas",pic:"slippery",q:"This sign means:",o:["The road is under construction","The road is slippery when wet — slow down","A car wash is ahead","Loose gravel ahead"],a:1,e:"Pista escorregadia com chuva. Reduza e evite manobras bruscas.",ref:58},
{c:"Placas",pic:"pavementends",q:"This sign means:",o:["The road ends completely","The paved surface ends and an unpaved road begins","A parking area begins","A bridge is ahead"],a:1,e:"O asfalto acaba e começa trecho não pavimentado. Reduza bastante antes da transição.",ref:58},
{c:"Placas",pic:"hill",q:"This sign warns you of:",o:["A steep downgrade ahead","A bridge ahead","A speed bump","A truck weigh station"],a:0,e:"Descida acentuada. Reduza a marcha para não depender só do freio.",ref:58},
{c:"Placas",pic:"guide",q:"A road sign of this color provides:",o:["A warning of danger","Guidance and directional information","Regulatory rules you must obey","Information about services"],a:1,e:"Verde é orientação e direção. Vermelho é proibição, amarelo é advertência, laranja é obra, azul é serviços.",ref:46},
{c:"Placas",pic:"noturnonred",q:"Where this sign is posted, you:",o:["May turn right on red after stopping","May not turn right or left while the light is red","May turn only between 9 a.m. and 5 p.m.","Must always turn right"],a:1,e:"Sem essa placa, a conversão à direita no vermelho é permitida após parada completa. Com ela, você espera o verde.",ref:48},
{c:"Placas",pic:"nouturn",q:"This sign means you must not:",o:["Turn right","Make a complete turn to go in the opposite direction","Change lanes","Park on this street"],a:1,e:"Proibido fazer o retorno. Também não faça three-point turn em curva, lombada ou rodovia.",ref:48},
{c:"Placas",pic:"norightturn",q:"This sign means:",o:["Right turns are allowed only after stopping","You must not make a right turn at this intersection","Right lane ends","Right turn only"],a:1,e:"Proibida a conversão à direita naquele cruzamento.",ref:48},
{c:"Placas",pic:"keepright",q:"This sign tells you to:",o:["Stay to the right of the divider","Turn right at the next street","Move to the left lane","Merge with traffic"],a:0,e:"Keep Right. Passe pelo lado direito do obstáculo ou do canteiro.",ref:48},
{c:"Placas",pic:"slowertraffic",q:"This sign means that slower traffic must:",o:["Stay in the right lane and let faster vehicles pass","Use the left lane","Stop and wait","Increase speed"],a:0,e:"Quem anda mais devagar fica à direita e sai da faixa da esquerda quando for ultrapassado.",ref:48},
{c:"Placas",pic:"passwithcare",q:"This sign means:",o:["Passing is forbidden","You are allowed to pass, but with caution","The road narrows","You must yield"],a:1,e:"Marca o fim do trecho de proibição. Ultrapasse apenas quando enxergar a via livre.",ref:48},
{c:"Placas",pic:"mustturn",q:"This sign means:",o:["You may go straight or turn","You cannot go straight ahead; you must turn right or left","Traffic merges from both sides","Two-way traffic ahead"],a:1,e:"Must Turn. Seguir em frente não é opção naquele ponto.",ref:48},
{c:"Placas",pic:"leftlaneturn",q:"This sign means that traffic in the left lane:",o:["May turn left or go straight","Must turn left","Must merge right","May stop and wait"],a:1,e:"Quem está na faixa da esquerda é obrigado a virar à esquerda. Escolha a faixa certa com antecedência.",ref:48},
{c:"Placas",pic:"noparkpave",q:"This sign means:",o:["Parking is free here","If you stop, you must park completely off the pavement","Parking is allowed for 15 minutes","Only trucks may park here"],a:1,e:"Nada do veículo pode ficar sobre o asfalto.",ref:48},
{c:"Placas",pic:"redarrow",q:"A steady red arrow means:",o:["You may turn in the direction of the arrow after stopping","You must not turn in the direction of the arrow","Turns are allowed with caution","The signal is broken"],a:1,e:"Seta vermelha proíbe a conversão naquele sentido. Espere a seta verde.",ref:51},
{c:"Placas",pic:"greenarrow",q:"A green arrow shown at the same time as a red light means you:",o:["May turn in the direction of the arrow if you are in the proper lane","Must wait for the red light to change","May go straight ahead","Must stop and then turn"],a:0,e:"A seta verde protege a conversão. Você só precisa estar na faixa correta para aquela manobra.",ref:52},
{c:"Placas",pic:"yellowarrow",q:"A steady yellow arrow means:",o:["The turn is now protected","The green arrow is ending; stop if you can do so safely","You may turn faster","Turns are always prohibited"],a:1,e:"A seta verde está terminando ou o sinal vai fechar. Já uma seta amarela piscante permite virar, cedendo ao tráfego contrário.",ref:52},
{c:"Placas",q:"A flashing red traffic light means:",o:["Stop, then proceed when it is safe","Slow down and proceed with caution","The signal is out of service; ignore it","Speed up to clear the intersection"],a:0,e:"Vermelho piscante equivale a uma placa de PARE. Amarelo piscante significa seguir com cautela.",ref:52},
{c:"Placas",q:"A steady yellow traffic light means:",o:["Speed up to beat the red","Stop if you can do so safely","Stop only if pedestrians are present","The light will stay yellow"],a:1,e:"Se você já estiver dentro do cruzamento, complete a passagem em vez de frear bruscamente.",ref:51},
{c:"Placas",q:"A single broken white line on the highway means:",o:["Traffic moves in opposite directions","Lanes move in the same direction and you may change lanes","Passing is prohibited","The road edge is ahead"],a:1,e:"Branca separa faixas do mesmo sentido; tracejada permite mudar de faixa. Amarela separa sentidos opostos.",ref:43},
{c:"Placas",q:"A double solid yellow line in the center of the highway means:",o:["Either direction may pass","Vehicles moving in either direction must not cross to pass","Passing is allowed during the day","The road is one-way"],a:1,e:"Ninguém ultrapassa. Você pode cruzá-la para virar à esquerda ou para desviar de um ciclista com segurança.",ref:43},
{c:"Placas",q:"A solid yellow line on your side of the center line means that you:",o:["May pass with care","May not pass","May pass only at intersections","Must change lanes"],a:1,e:"A linha do SEU lado é que manda. Se do outro lado ela é tracejada, é o outro motorista que pode ultrapassar.",ref:44},
{c:"Placas",q:"A center lane bordered by a solid yellow line outside and a broken yellow line inside is:",o:["A passing lane","A two-way left turn lane","A carpool lane","A bus-only lane"],a:1,e:"Faixa central compartilhada, exclusiva para conversão à esquerda. Não trafegue nem ultrapasse por ela.",ref:44},
{c:"Placas",q:"You see red reflectors facing you on the lane lines. This means:",o:["A rest area is ahead","You are going the wrong way; pull over and turn around","The lane is closed for repairs","A toll booth is ahead"],a:1,e:"Os refletores voltados para você são vermelhos apenas quando você está na contramão. Saia da via com segurança e retorne.",ref:69},

/* ===== VELOCIDADE, FAIXAS E DISTÂNCIAS ===== */
{c:"Velocidade",q:"Unless otherwise posted, the speed limit in a Florida business or residential area is:",o:["20 mph","30 mph","45 mph","55 mph"],a:1,e:"30 mph é o padrão. Zona escolar sinalizada é 20 mph, ruas e rodovias comuns 55 mph.",ref:68},
{c:"Velocidade",q:"Unless otherwise posted, the maximum speed limit on a Florida limited access highway is:",o:["55 mph","65 mph","70 mph","75 mph"],a:2,e:"70 mph em limited access highway. Em streets and highways em geral, 55 mph.",ref:68},
{c:"Velocidade",q:"Unless otherwise posted, the speed limit in a school zone during posted hours is:",o:["15 mph","20 mph","25 mph","30 mph"],a:1,e:"20 mph no horário sinalizado. As multas nessas zonas são agravadas.",ref:68},
{c:"Velocidade",q:"In Florida, driving too slowly is:",o:["Always legal","Against the law if you block or delay normal, safe traffic","Legal only in the right lane","Encouraged in bad weather"],a:1,e:"Você pode ser multado por bloquear ou atrasar o fluxo. Se precisar ir devagar, use a faixa da direita.",ref:68},
{c:"Velocidade",q:"The recommended minimum following distance in favorable weather and traffic is:",o:["Two seconds","Three seconds","Four seconds","One car length per 10 mph"],a:2,e:"Quatro segundos. Conte a partir do momento em que o carro da frente passa por um poste ou placa fixa.",ref:61},
{c:"Velocidade",q:"You should increase your following distance when:",o:["The road is dry and clear","It is raining, visibility is low, or you are pulling a trailer","You are in the left lane","You are driving downhill only"],a:1,e:"Também aumente ao ser ultrapassado e ao parar atrás de outro veículo numa subida, porque ele pode recuar.",ref:61},
{c:"Velocidade",q:"When you double the speed of a car, its force of impact increases:",o:["Two times","Four times","Six times","Nine times"],a:1,e:"O dobro da velocidade dá quatro vezes a força de impacto; o triplo dá nove vezes.",ref:60},
{c:"Velocidade",q:"On a road with four or more lanes and two-way traffic, you should drive in:",o:["The left lanes","The right lanes, except when overtaking and passing","Whichever lane is emptiest","The center lane only"],a:1,e:"Faixa da esquerda é para ultrapassagem. Bloquear a esquerda andando devagar é infração.",ref:68},
{c:"Velocidade",q:"Hydroplaning usually begins at speeds around:",o:["10 mph","20 mph","35 mph","60 mph"],a:2,e:"Em pista molhada, por volta de 35 mph. Tire o pé do acelerador e evite frear.",ref:79},
{c:"Velocidade",q:"You must signal your intention to turn during the last:",o:["50 feet","100 feet","200 feet","500 feet"],a:1,e:"Últimos 100 pés antes da conversão, com a seta ou com sinal de braço.",ref:20},
{c:"Velocidade",q:"When passing a bicyclist, a motorist must allow a clearance of at least:",o:["1 foot","3 feet","6 feet","10 feet"],a:1,e:"Mínimo de 3 pés e velocidade reduzida. Em pista de mão dupla, ultrapasse como faria com um veículo lento.",ref:81},
{c:"Velocidade",q:"You must not attempt to share a lane with a motorcycle because the motorcyclist:",o:["Is entitled to the entire lane","Is always slower than cars","Cannot be seen at night","Has no right-of-way"],a:0,e:"A motocicleta tem direito à faixa inteira. Motociclistas e condutores de moped têm os mesmos direitos e deveres dos demais motoristas.",ref:85},
{c:"Velocidade",q:"A truck or a vehicle towing another vehicle must not follow another truck closer than:",o:["100 feet","300 feet","500 feet","1,000 feet"],a:1,e:"300 pés fora de cidades e vilas. A regra não vale durante a ultrapassagem.",ref:62},
{c:"Velocidade",q:"It is against the law to follow a fire truck responding to an emergency closer than:",o:["100 feet","300 feet","500 feet","1,000 feet"],a:2,e:"500 pés. Também não pare nem estacione perto do local da ocorrência.",ref:62},
{c:"Velocidade",q:"A \"No Zone\" is:",o:["An area where parking is banned","The blind spot area around a large truck or bus where the driver cannot see you","A school zone","A construction area"],a:1,e:"Quanto maior o veículo, maiores os pontos cegos. Se você não enxerga os espelhos do caminhão, o motorista não enxerga você.",ref:82},

/* ===== LEIS, DOCUMENTOS E ÁLCOOL ===== */
{c:"Leis",q:"In Florida, a driver 21 or older is legally impaired at a blood alcohol level of:",o:["0.02% or higher","0.05% or higher","0.08% or higher","0.10% or higher"],a:2,e:"0.08% para maiores de 21. Para menores de 21 o limite é 0.02%, praticamente zero.",ref:25},
{c:"Leis",q:"Under Florida's Implied Consent Law, by signing your driver license you have agreed to:",o:["Take a breath, blood or urine test when lawfully requested","Never drink alcohol","Allow your car to be searched at any time","Carry your license at all times"],a:0,e:"Recusar o teste tem penalidade própria: a primeira recusa suspende a habilitação por 1 ano.",ref:25},
{c:"Leis",q:"After drinking alcohol, which is affected first?",o:["Your vision","Your judgment","Your hearing","Your reaction time"],a:1,e:"O julgamento é o primeiro a ser afetado — por isso a pessoa se acha capaz de dirigir quando já não está.",ref:35},
{c:"Leis",q:"The three main categories of driver distraction are:",o:["Visual, manual and cognitive","Loud, quiet and sudden","Legal, illegal and risky","Internal, external and mechanical"],a:0,e:"Visual é tirar os olhos da via, manual é tirar as mãos do volante, cognitiva é pensar em outra coisa. Digitar mensagens envolve as três ao mesmo tempo.",ref:34},
{c:"Leis",q:"Florida's No-Fault Law requires vehicle owners to carry a minimum of:",o:["$5,000 PIP and $5,000 PDL","$10,000 PIP and $10,000 PDL","$25,000 PIP only","$50,000 PDL only"],a:1,e:"US$ 10.000 de Personal Injury Protection e US$ 10.000 de Property Damage Liability, mantidos durante todo o período de registro.",ref:23},
{c:"Leis",q:"Children under age 4 must ride in:",o:["A separate carrier or child safety seat","A booster seat","A regular safety belt","The back seat with no restraint"],a:0,e:"Menores de 4 anos usam cadeirinha. Aos 4 e 5 anos, cadeirinha ou assento de elevação.",ref:27},
{c:"Leis",q:"If a passenger under 18 is not properly restrained, who is charged with the violation?",o:["The passenger","The driver","Both equally","Nobody, if the car has airbags"],a:1,e:"O motorista responde por qualquer passageiro menor de 18 anos sem cinto ou sem cadeirinha. Passageiros de 18 anos ou mais respondem por si.",ref:27},
{c:"Leis",q:"Leaving the scene of a crash involving injury or death is:",o:["A minor traffic ticket","A felony offense","Allowed if you leave a note","Allowed if you were not at fault"],a:1,e:"É crime grave na Flórida, com pena de prisão.",ref:77},
{c:"Leis",q:"A driver with a Florida learner's license may drive:",o:["At any hour with any licensed adult","Daylight hours only for the first three months, then until 10 p.m.","Only on weekends","Only between 6 a.m. and 6 p.m."],a:1,e:"Nos três primeiros meses só à luz do dia; depois, até as 22h. Sempre com condutor habilitado de 21 anos ou mais no banco da frente.",ref:25},
{c:"Leis",q:"Before getting a Class E license, a learner's license holder must log at least:",o:["20 hours of driving, 5 at night","50 hours of driving, 10 at night","100 hours of driving, 20 at night","No minimum is required"],a:1,e:"50 horas de prática, sendo 10 à noite.",ref:8},
{c:"Leis",q:"A licensed driver who is 16 years old may drive:",o:["At any time","Between 6 a.m. and 11 p.m., unless driving to or from work","Only with a parent","Between 5 a.m. and 1 a.m."],a:1,e:"Aos 16 anos, das 6h às 23h. Aos 17, das 5h à 1h. As exceções são trabalho ou acompanhamento de motorista habilitado com 21 anos ou mais.",ref:25},
{c:"Leis",q:"A first-time applicant who has never held a driver license in any state or country must complete:",o:["A defensive driving course","The Traffic Law and Substance Abuse Education (TLSAE) course","An advanced driver improvement course","A commercial driving course"],a:1,e:"O TLSAE é exigido de quem nunca teve carteira em lugar nenhum. Quem já tem habilitação estrangeira normalmente é dispensado.",ref:8},
{c:"Leis",q:"Are you required to notify FLHSMV of health problems that may affect your driving?",o:["Yes","No","Only if you are over 65","Only for vision problems"],a:0,e:"É sua obrigação informar. Omitir pode invalidar sua habilitação.",ref:9},
{c:"Leis",q:"You must report a crash to law enforcement when there is injury, death, or property damage of at least:",o:["$100","$250","$500","$1,000"],a:2,e:"A partir de US$ 500 em danos, ou qualquer caso com feridos ou morte.",ref:77},
{c:"Leis",q:"You hit a parked car and cannot find the owner. You must:",o:["Drive away if the damage is small","Leave a note with your name and address and report the crash","Wait one hour and then leave","Call your insurance only"],a:1,e:"Deixe um bilhete com nome e endereço em local visível e comunique a ocorrência. Sair sem isso configura fuga do local.",ref:77},

/* ===== EMERGÊNCIAS E VEÍCULOS ESPECIAIS ===== */
{c:"Emergências",q:"An emergency vehicle with siren and lights approaches from behind. You should:",o:["Speed up to get out of the way","Stop immediately in your lane","Pull over to the closest edge of the road and stop","Move to the left lane and continue"],a:2,e:"Encoste na borda mais próxima e pare até o veículo passar. Não entre num cruzamento onde você atrapalharia a passagem.",ref:84},
{c:"Emergências",q:"You approach a stopped emergency vehicle with flashing lights on a multi-lane road. The Move Over Law requires you to first:",o:["Slow down only","Move over into a lane away from the stopped vehicle when it is safe","Stop completely","Sound your horn"],a:1,e:"Mudar de faixa é a obrigação principal. A lei vale também para guinchos, veículos de serviço, veículos avariados com pisca-alerta e veículos usando sinalização de emergência.",ref:65},
{c:"Emergências",q:"If you cannot move over for a stopped emergency vehicle and the speed limit is 55 mph, you must slow to:",o:["45 mph","35 mph","25 mph","5 mph"],a:1,e:"20 mph abaixo do limite. Se o limite for 20 mph ou menos, você reduz para 5 mph.",ref:65},
{c:"Emergências",q:"A school bus stops with red lights flashing on a two-lane road with no median. You must:",o:["Slow to 20 mph and pass","Stop, no matter which direction you are traveling","Stop only if you are behind the bus","Proceed if no children are visible"],a:1,e:"Sem canteiro central, todos param nos dois sentidos. É a regra que mais pega motorista estrangeiro.",ref:89},
{c:"Emergências",q:"On a highway divided by a raised barrier or median, a school bus stops on the other side. Vehicles traveling in the opposite direction:",o:["Must stop","Are not required to stop, but should stay alert","Must slow to 10 mph","Must change lanes"],a:1,e:"Com barreira elevada ou canteiro separando os sentidos, o tráfego contrário segue. No mesmo sentido do ônibus, todos param sempre.",ref:89},
{c:"Emergências",q:"During a tire blowout, you should:",o:["Brake hard immediately","Take your foot off the gas, concentrate on steering and slow down gradually","Turn sharply to the shoulder","Accelerate to regain control"],a:1,e:"Não use os freios de imediato. Freie suavemente só depois que o carro estiver sob controle e saia completamente da pista.",ref:80},
{c:"Emergências",q:"Your right wheels run off the pavement. You should:",o:["Steer back onto the road immediately","Brake hard","Take your foot off the gas, hold the wheel straight, brake lightly and return slowly","Accelerate to climb back up"],a:2,e:"Overcorrection — girar o volante bruscamente — é a principal causa de capotamento nessa situação. Volte à pista devagar e sinalizando.",ref:79},
{c:"Emergências",q:"If your vehicle begins to skid or hydroplane, you should:",o:["Brake hard and hold the wheel","Take your foot off the gas, avoid braking, and steer where you want to go","Accelerate gently","Shift into neutral and brake"],a:1,e:"Tire o pé do acelerador, não freie se puder evitar, e aponte as rodas dianteiras para onde você quer ir.",ref:79},
{c:"Emergências",q:"If your gas pedal jams, your first action should be:",o:["Shut off the engine","Take your foot off the gas pedal and shift to neutral","Pull the parking brake hard","Steer into the shoulder immediately"],a:1,e:"Desligar o motor faz você perder a direção assistida, então é o último recurso. Depois de neutralizar, freie firme mas sem travar e encoste.",ref:79},
{c:"Emergências",q:"A vehicle is approaching head-on in your lane. You should:",o:["Sound your horn, flash your high beams, brake hard and steer to the side of the road","Accelerate and pass on the left","Stop in the middle of the lane","Turn off your headlights"],a:0,e:"Buzina e farol alto para alertar, freio firme, e desvio para a lateral da via.",ref:80},
{c:"Emergências",q:"If your car stalls on railroad tracks, you should:",o:["Stay inside and try to restart it","Get everyone out immediately and move away from the car","Push the car with another vehicle","Wait for the crossing gates to lift"],a:1,e:"Saia todo mundo na hora. Se um trem estiver vindo, corra num ângulo de 45 graus na direção do trem, para escapar dos destroços.",ref:79},
{c:"Emergências",q:"At night, you must dim your high beam headlights within how many feet of an oncoming vehicle?",o:["100 feet","300 feet","500 feet","1,000 feet"],a:2,e:"500 pés para veículo em sentido contrário e 300 pés quando você vem atrás de outro veículo.",ref:72},
{c:"Emergências",q:"When driving in rain, fog or smoke during the daytime, you should use:",o:["High beams","Low beams","Parking lights only","Hazard lights while moving"],a:1,e:"Farol baixo. O alto reflete na névoa e piora a visibilidade. Usar apenas as lanternas no lugar do farol é proibido.",ref:71},
{c:"Emergências",q:"Your vehicle breaks down on a highway. You should:",o:["Stop in the traffic lane and turn on hazard lights","Move the vehicle completely off the pavement, onto the shoulder","Leave it where it stops and walk away","Push it into the left lane"],a:1,e:"Tire o carro da pista, ligue o pisca-alerta e sinalize. Se puder, saia pelo lado oposto ao tráfego.",ref:64},
{c:"Emergências",q:"You are involved in a minor crash and your vehicle is blocking traffic. You must:",o:["Leave the vehicle exactly where it is until police arrive","Move it out of the traffic lane if it can be driven safely","Push it into the nearest driveway","Abandon it and call a tow truck"],a:1,e:"Em batida leve sem feridos, tirar o veículo da pista é obrigação. Deixar tudo parado no meio da via cria risco de nova colisão.",ref:77},
{c:"Emergências",q:"You are approaching a railroad crossing with no gates or lights and you see a train coming. You should:",o:["Speed up to cross before the train","Stop and wait until the train has completely passed","Cross if the train is more than 100 feet away","Sound your horn and cross"],a:1,e:"Trem é sempre mais rápido e mais próximo do que parece. Espere passar por completo e confira se não vem outro na segunda linha.",ref:56},

/* ===== MANOBRAS, ESTACIONAMENTO E VEÍCULO ===== */
{c:"Manobras",q:"If a road is too narrow to make a U-turn, you may make:",o:["A two-point turn","A three-point turn","A four-point turn","A five-point turn"],a:1,e:"Encoste à direita e sinalize à esquerda, avance girando todo à esquerda, dê ré girando todo à direita, e siga em frente. Frente, ré, frente.",ref:70},
{c:"Manobras",q:"You should never make a three-point turn or a U-turn:",o:["On a residential street","On a curve, a hill, a highway, or where a sign prohibits U-turns","At any intersection","During the day"],a:1,e:"Em curva ou lombada, outro motorista não enxerga você a tempo.",ref:70},
{c:"Manobras",q:"Before changing lanes, you should:",o:["Use your mirrors only","Check mirrors, signal, and look over your shoulder at the blind spot","Signal and change immediately","Sound your horn"],a:1,e:"Espelhos não cobrem o ponto cego. Na prova prática, não olhar por cima do ombro é falta.",ref:60},
{c:"Manobras",q:"When parked, your vehicle must be no farther from the curb than:",o:["6 inches","12 inches","18 inches","24 inches"],a:1,e:"12 polegadas, cerca de 30 cm.",ref:65},
{c:"Manobras",q:"When parking uphill next to a curb, your front wheels should be turned:",o:["Toward the curb","Away from the curb","Straight ahead","It does not matter"],a:1,e:"Subida com meio-fio, rodas para fora. Descida, rodas para o meio-fio. Sem meio-fio, rodas para a direita, na direção do acostamento.",ref:65},
{c:"Manobras",q:"You may turn right on a red light in Florida:",o:["Never","After coming to a complete stop, unless a NO TURN ON RED sign is posted","Without stopping, if the way is clear","Only between 6 a.m. and 10 p.m."],a:1,e:"Pare completamente, ceda a pedestres na faixa e ao tráfego que vem, e então converta.",ref:51},
{c:"Manobras",q:"You may turn left on a red light:",o:["Never","From a one-way street onto a one-way street with traffic moving to the left, after stopping","At any intersection after stopping","Only with a green arrow"],a:1,e:"De mão única para mão única, após parada completa e se não houver placa proibindo.",ref:51},
{c:"Manobras",q:"You may stop in the acceleration lane of an expressway:",o:["Whenever traffic is heavy","Only in an emergency","To check directions","To let a passenger out"],a:1,e:"A faixa de aceleração serve para ganhar velocidade. Parar ali cria risco sério de colisão traseira.",ref:63},
{c:"Manobras",q:"You drive past your exit on a limited access highway. You should:",o:["Back up on the shoulder","Continue to the next exit and turn around there","Make a U-turn across the median","Stop and wait for a gap"],a:1,e:"Dar ré ou cruzar o canteiro em rodovia é proibido e extremamente perigoso.",ref:64},
{c:"Manobras",q:"When passing another vehicle, you should return to your lane when:",o:["You have cleared its front bumper","You can see both of its headlights in your rearview mirror","The other driver signals you","You have passed the halfway point"],a:1,e:"Enxergar os dois faróis no retrovisor central significa que há espaço suficiente para voltar sem fechar o outro carro.",ref:67},
{c:"Manobras",q:"To make a smooth stop, you should:",o:["Brake hard as late as possible","Check mirrors and blind spots, release the accelerator, then brake gradually","Shift into neutral and coast","Pump the brakes rapidly"],a:1,e:"Paradas bruscas dificultam a reação de quem vem atrás e causam colisão traseira.",ref:68},
{c:"Manobras",q:"Backing up on a highway or expressway is:",o:["Allowed if you miss your exit","Never permitted","Allowed on the shoulder only","Allowed at low speed"],a:1,e:"Nunca dê ré em rodovia, nem no acostamento.",ref:64},
{c:"Manobras",q:"Before you start the engine, you should adjust:",o:["Only the radio","Your seat, mirrors and head restraint, and fasten your safety belt","Only the air conditioning","Nothing; adjust while driving"],a:1,e:"Tudo o que exige atenção deve ser ajustado com o carro parado.",ref:59},
{c:"Manobras",q:"If you are hauling a load of material that could fall or blow onto the roadway, you must:",o:["Drive below 40 mph","Cover and secure the load so nothing escapes","Use hazard lights","Drive only at night"],a:1,e:"Carga solta na pista é infração e causa acidentes graves atrás de você.",ref:42},
{c:"Manobras",q:"A load that extends more than four feet beyond your vehicle must be marked with:",o:["A red flag in the daytime and a red light at night","A white flag at all times","Nothing, if under six feet","An orange triangle only"],a:0,e:"Bandeira vermelha de dia e luz vermelha à noite, visível de trás.",ref:42},
{c:"Manobras",q:"When emergency braking with anti-lock brakes (ABS), you should:",o:["Pump the brake pedal","Apply firm, steady pressure and keep steering","Release the brake repeatedly","Use the parking brake"],a:1,e:"Com ABS, pressão firme e contínua, sem bombear — o sistema pulsa sozinho. Sem ABS, aí sim você bombeia para não travar as rodas.",ref:78}
];

const CATS = ["Todas","Preferência","Placas","Velocidade","Leis","Emergências","Manobras"];
const LENS = [10, 20, 50, 0];
let cat = "Todas", len = 20;
let deck = [], idx = 0, misses = [], answered = false;
const app = document.getElementById("app");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lenLabel = n => n === 0 ? "Tudo (" + BANK.length + ")" : n + " questões";

function pictureFor(item){
  if(!item.pic) return "";
  if(typeof IMG !== "undefined" && IMG[item.pic])
    return `<div class="stage"><img src="data:image/png;base64,${IMG[item.pic]}" alt="Placa de trânsito"></div>`;
  if(SVGS[item.pic]) return `<div class="stage">${SVGS[item.pic]}</div>`;
  return "";
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function home(){
  app.innerHTML = `
    <h1>Simulado Class E</h1>
    <p class="sub">Prova teórica da Flórida. Pergunta em inglês, explicação em português. Placas e diagramas do manual oficial. As questões embaralham a cada rodada.</p>
    <div class="field"><div class="label">Assunto</div><div class="chips" id="cats"></div></div>
    <div class="field"><div class="label">Tamanho</div><div class="chips" id="lens"></div></div>
    <button class="btn" id="go">Começar rodada</button>
    <p class="foot">Questões escritas a partir do Official Florida Class E Driver License Handbook (rev. 08/2023) e do guia oficial de estudo da FLHSMV. Não são as perguntas literais da prova, que não são públicas. Imagens das placas extraídas do manual, uma publicação do governo da Flórida.</p>`;
  const cw = document.getElementById("cats");
  CATS.forEach(c => {
    const n = c === "Todas" ? BANK.length : BANK.filter(q => q.c === c).length;
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", c === cat);
    b.textContent = c + " · " + n;
    b.onclick = () => { cat = c; home(); };
    cw.appendChild(b);
  });
  const lw = document.getElementById("lens");
  LENS.forEach(n => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", n === len);
    b.textContent = lenLabel(n);
    b.onclick = () => { len = n; home(); };
    lw.appendChild(b);
  });
  document.getElementById("go").onclick = start;
}

function start(){
  const pool = cat === "Todas" ? BANK : BANK.filter(q => q.c === cat);
  const size = len === 0 ? pool.length : Math.min(len, pool.length);
  deck = shuffle(pool).slice(0, size).map(q => {
    const order = shuffle(q.o.map((t,i) => ({t,i})));
    return {q:q.q, c:q.c, e:q.e, pic:q.pic, ref:q.ref, opts:order.map(o=>o.t), a:order.findIndex(o=>o.i===q.a)};
  });
  idx = 0; misses = []; answered = false;
  render();
}

function render(){
  const item = deck[idx];
  const pct = Math.round((idx / deck.length) * 100);
  app.innerHTML = `
    <div class="lane"><div class="lane-fill" style="width:${pct}%"></div></div>
    <div class="meta"><span><b>${idx+1}</b> de ${deck.length}</span><span>${esc(item.c)}</span></div>
    ${pictureFor(item)}
    <p class="q">${esc(item.q)}</p>
    <div id="opts"></div><div id="after"></div>`;
  const ow = document.getElementById("opts");
  item.opts.forEach((t,i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.textContent = t;
    b.onclick = () => choose(i);
    ow.appendChild(b);
  });
  window.scrollTo(0,0);
}

function choose(i){
  if(answered) return;
  answered = true;
  const item = deck[idx];
  const ok = i === item.a;
  if(!ok) misses.push({q:item.q, right:item.opts[item.a], e:item.e, ref:item.ref});
  [...document.querySelectorAll(".opt")].forEach((b,n) => {
    b.disabled = true;
    if(n === item.a) b.classList.add("right");
    else if(n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = idx === deck.length - 1;
  document.getElementById("after").innerHTML = `
    <div class="exp">
      <div class="verdict ${ok ? "ok" : "no"}">${ok ? "Correto." : "Não é essa."}</div>
      <p>${esc(item.e)}</p>
      ${item.ref ? `<p class="ref">Handbook, página ${item.ref}</p>` : ""}
    </div>
    <button class="btn" id="next">${last ? "Ver resultado" : "Próxima"}</button>`;
  const nb = document.getElementById("next");
  nb.focus();
  nb.onclick = () => { if(last) return result(); idx++; answered = false; render(); };
}

function result(){
  const right = deck.length - misses.length;
  const pct = Math.round((right / deck.length) * 100);
  const pass = pct >= 80;
  app.innerHTML = `
    <div class="lane"><div class="lane-fill" style="width:100%"></div></div>
    <div class="meta"><span>Rodada concluída</span><span>${esc(cat)}</span></div>
    <p class="score ${pass ? "pass" : "fail"}">${pct}%</p>
    <p class="big">${right} de ${deck.length} — ${pass ? "acima da nota de corte" : "abaixo da nota de corte de 80%"}</p>
    <div class="actions">
      <button class="btn" id="again">Nova rodada</button>
      <button class="btn ghost" id="back">Mudar assunto</button>
    </div><div id="rev"></div>`;
  if(misses.length){
    const r = document.createElement("div");
    r.className = "review";
    r.innerHTML = "<h2>Para revisar</h2>";
    misses.forEach(m => {
      const d = document.createElement("div");
      d.className = "miss";
      d.innerHTML = `<p class="mq">${esc(m.q)}</p><p class="ma">${esc(m.right)}</p>
        <p class="me">${esc(m.e)}${m.ref ? " (handbook, p. " + m.ref + ")" : ""}</p>`;
      r.appendChild(d);
    });
    document.getElementById("rev").appendChild(r);
  }
  document.getElementById("again").onclick = start;
  document.getElementById("back").onclick = home;
  window.scrollTo(0,0);
}

home();
</script>
